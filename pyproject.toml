[project]
name = "chatbot-fai-docs"
version = "0.1.0"
description = "Protótipo simples de chatbot para consultar documentos PDF localmente"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.70.0",
    "numpy>=2.1.3",
    "openai>=1.75.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.6",
    "pymupdf4llm>=1.27.2.2",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.4.1",
    "streamlit>=1.44.1",
    "torchvision>=0.26.0",
]

[tool.uv]
package = false
