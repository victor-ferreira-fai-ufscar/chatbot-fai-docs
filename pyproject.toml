[project]
name = "chatbot-fai-docs"
version = "0.1.0"
description = "Protótipo simples de chatbot para consultar documentos PDF localmente"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1.3",
    "openai>=1.75.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.6",
    "pypdf>=5.4.0",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.4.1",
    "streamlit>=1.44.1",
]

[tool.uv]
package = false