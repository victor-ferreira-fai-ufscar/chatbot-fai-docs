# Stack completa: LightRAG (grafo) + Backend FastAPI + Frontend Next.js.
# Todos em network_mode: host para alcancar o Ollama do host (127.0.0.1:11434)
# sem precisar reconfigura-lo — mesmo padrao do open-webui nesta maquina.
#  - frontend: 0.0.0.0:3000 (acessivel pela rede)
#  - backend:  0.0.0.0:8000 (acessivel pela rede; CORS restrito ao frontend)
#  - lightrag: 127.0.0.1:9621 (APENAS local — sem autenticacao, nao expor)
services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: fai_lightrag
    network_mode: host
    environment:
      # Exposto na rede COM autenticacao: toda chamada a API exige o header
      # X-API-Key. A chave vem do .env (mesma var usada pelo backend) via
      # interpolacao do compose; NAO colocar o valor literal aqui (vaza no git).
      # A guarda :? faz o `docker compose up` falhar claro se a var faltar.
      HOST: "0.0.0.0"
      PORT: "9621"
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:?defina LIGHTRAG_API_KEY no .env}
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      # LLM e embeddings 100% locais via Ollama do host
      LLM_BINDING: ollama
      # Sintese do RAG. gpt-oss:20b (MoE 20.9B/MXFP4, estavel e ja validado 9/9 pela
      # rota real do chatbot) substitui gemma4:26b: a familia Gemma 4 MoE-26B/31B tem
      # bug upstream de loop de repeticao degenerada (saturacao de logit no softcap,
      # imune a repeat_penalty) reproduzido em Ollama/vLLM/llama.cpp -> instavel para
      # sintese. gpt-oss tem KV cache baratissimo (~2.6 GB) e melhor co-residencia.
      LLM_MODEL: gpt-oss:latest
      LLM_BINDING_HOST: http://127.0.0.1:11434
      # Temperatura da sintese. ANTES nao era setada -> caia no DEFAULT_TEMPERATURE=1.0
      # do LightRAG (pior caso para fundamentacao estrita: incentiva divagacao e
      # citacao inconsistente). Fixada baixa (0.1) via binding_options do LightRAG
      # (lightrag/llm/binding_options.py injeta como options.temperature no Ollama).
      # O QueryRequest da API NAO expoe temperature; so da pra fixar por env do servidor.
      OLLAMA_LLM_TEMPERATURE: "0.1"
      # Janela total (entrada+saida) por requisicao, alocada por slot paralelo do
      # Ollama (KV cache na VRAM). 65536 da folga de geracao para um modelo de
      # RACIOCINIO (gpt-oss "pensa" antes de responder e consome tokens nisso): com
      # MAX_TOTAL_TOKENS=48000 de contexto-fonte, sobram ~17000 tokens para raciocinio
      # + resposta. O KV cache do gpt-oss e barato, entao 65536 cabe na VRAM da RTX 5090.
      OLLAMA_LLM_NUM_CTX: "65536"
      # 48000 de contexto montado dentro dos 52224 de num_ctx -> sobram ~4000 tokens
      # para a geracao da resposta. Mais contexto-fonte = respostas mais aprofundadas,
      # mesmo quando o grafo retorna muitas entidades/relacoes.
      MAX_TOTAL_TOKENS: "48000"
      # Sem estes caps, os defaults do LightRAG (entity 6000 + relation 8000 = 14000)
      # ja estouram sozinhos o MAX_TOTAL_TOKENS=13000, zerando o orcamento dos chunks
      # de texto. Resultado: modos com grafo (local/mix/hybrid) retornavam "no-context"
      # mesmo com 80+ entidades recuperadas. Com 3000+3000 sobra espaco para os chunks.
      MAX_ENTITY_TOKENS: "6000"
      MAX_RELATION_TOKENS: "5000"
      # Quantos chunks de texto-fonte sao recuperados. Reduzido 32 -> 10 -> 8: o manual
      # re-indexado (page-aware) tem apenas ~22 chunks, entao top_k alto recuperava o
      # DOCUMENTO INTEIRO toda vez, diluindo o sinal e estourando a faixa de paginas
      # citadas ("quase todo o PDF"). Com 8 + reranker (ver RERANK_* abaixo), pegamos os
      # 8 chunks MAIS relevantes (nao os 8 mais proximos) -> resposta direta e pagina precisa.
      CHUNK_TOP_K: "8"
      EMBEDDING_BINDING: ollama
      EMBEDDING_MODEL: bge-m3:latest
      EMBEDDING_DIM: "1024"
      EMBEDDING_BINDING_HOST: http://127.0.0.1:11434
      OLLAMA_EMBEDDING_NUM_CTX: "8192"
      SUMMARY_LANGUAGE: Portuguese
      # Concorrencia de requisicoes ao LLM. Mantido em 1 para reduzir a pressao de
      # VRAM (menos KV cache simultaneo); uso interno de baixo trafego dispensa
      # paralelismo. Nao deve exceder o OLLAMA_NUM_PARALLEL do host, senao a fila
      # estoura timeout (ReadTimeout).
      MAX_ASYNC: "1"
      TIMEOUT: "600"
      # ── Reranker (cross-encoder) na GPU via TEI + adaptador Cohere->TEI (servicos
      # 'reranker' e 'reranker-adapter' abaixo). Ollama NAO serve reranker; o LightRAG so
      # fala binding 'cohere', e o adaptador (:7997) traduz para o TEI (:7998, GPU).
      # Reordena os chunks recuperados pelos MAIS relevantes antes de montar o contexto
      # -> menos ruido/diluicao com top_k baixo. Rollback: RERANK_BINDING=null.
      RERANK_BINDING: cohere
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
      RERANK_BINDING_HOST: http://127.0.0.1:7997/rerank
      # O Infinity local nao exige auth, mas o binding manda o header X-API-Key; valor
      # dummy resolve. Da p/ sobrescrever via RERANK_API_KEY no .env se um dia exigir.
      RERANK_BINDING_API_KEY: ${RERANK_API_KEY:-dummy}
      RERANK_BY_DEFAULT: "True"
      # Filtra chunks fracos ANTES da sintese (corta diluicao/alucinacao). 0.0 = so reordena.
      # 0.06 escolhido por MEDICAO real deste reranker (cohere->TEI, escala sigmoide 0..1):
      # distribuicao bimodal -> ruido <=~0.10, trecho legitimo >=0.42. 0.06 corta a cauda de
      # ruido sem nunca derrubar o secundario relevante (~0.42). NAO usar 0.4-0.6: cortaria o
      # 0.42 e causaria abstencao indevida. Manter a env explicita (fallback do codigo e 0.5).
      MIN_RERANK_SCORE: "0.06"
    volumes:
      - ./lightrag/data/rag_storage:/app/data/rag_storage
      - ./lightrag/data/inputs:/app/data/inputs
    depends_on:
      # Espera o ADAPTADOR ficar HEALTHY (o /health dele so passa quando o TEI na GPU
      # responde), p/ nunca pegar o reranker meio-carregado apos restart/reboot.
      reranker-adapter:
        condition: service_healthy
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # Reranker (cross-encoder) na GPU — HuggingFace TEI. Reordena os chunks recuperados
  # pelo LightRAG pelos MAIS relevantes a pergunta (precisao com top_k baixo).
  # Tag :120-1.9 = build com kernels sm_120 (Blackwell / RTX 5090): carrega em ~6s e
  # reranqueia ~22 chunks longos em ~25ms (vs ~35s em CPU — o gargalo que isso elimina).
  # Ollama nao serve reranker, por isso o servico dedicado. Expoe /rerank em 127.0.0.1:7998.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:120-1.9
    container_name: fai_reranker
    network_mode: host
    gpus: all
    volumes:
      # Cache do HuggingFace (layout do TEI): baixa o modelo (~2 GB) UMA vez e persiste.
      - ./reranker/tei-cache:/data
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "7998"]
    # Sem healthcheck aqui: a imagem TEI e um binario Rust (sem python/curl). A prontidao
    # e verificada pelo adaptador abaixo, cujo /health faz proxy do /health do TEI.
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # Adaptador Cohere -> TEI. O LightRAG so fala bindings cohere/jina/aliyun; o TEI tem
  # protocolo proprio (`texts` / `[{index,score}]`). Este micro-servico (CPU, ~40 linhas
  # em reranker-adapter/app.py) traduz nos dois sentidos e mantem o LightRAG apontando
  # para :7997 como antes — a troca CPU->GPU fica transparente. Seu /health so passa
  # quando o TEI responde, entao este healthcheck gateia o startup do lightrag.
  reranker-adapter:
    build:
      context: ./reranker-adapter
      dockerfile: Dockerfile
    container_name: fai_reranker_adapter
    network_mode: host
    environment:
      TEI_URL: http://127.0.0.1:7998
    depends_on:
      - reranker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fai_chatbot_backend
    network_mode: host
    # --- Aceleracao por GPU (Whisper / Speech-to-Text) ---
    # O backend usa a GPU (RTX 5090) para transcrever audio com o Whisper.
    # Pre-requisito (UMA vez, exige root no host):
    #   curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | \
    #     sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    #   curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
    #     sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
    #     sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
    #   sudo apt-get update && sudo apt-get install -y nvidia-container-toolkit
    #   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
    # Sem o toolkit, o backend roda em CPU automaticamente (mais lento, mas funciona).
    gpus: all
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs
      # Pasta src/IA montada do host: permite editar o Prompt.md (lido a cada
      # requisicao) sem rebuild da imagem. Monta-se o DIRETORIO, nao o arquivo
      # unico: bind-mount de arquivo prende o inode antigo e edicoes so refletem
      # apos restart; com o diretorio, as edicoes refletem na hora.
      - ./backend/src/IA:/app/src/IA
    depends_on:
      - lightrag
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fai_chatbot_frontend
    network_mode: host
    depends_on:
      - backend
    restart: always

  # ───────────────────────────────────────────────────────────────────────────
  # Reverse proxy MOVIDO para um Caddy central em /srv/docker/caddy, que agora
  # roteia este chatbot E os demais serviços da máquina por subdomínio
  # (lina/chat/git . fai.ufscar.br) além do acesso histórico por IP. A CA interna
  # daqui (./caddy/data) foi migrada para lá, então a confiança é preservada.
  # Mantido comentado para referência/rollback — NÃO suba este serviço junto com
  # o central (conflito na porta 443).
