  # caddy:
  #   image: caddy:2
  #   container_name: fai_caddy
  #   network_mode: host
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - ./caddy/data:/data
  #     - ./caddy/config:/config
  #   depends_on:
