version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fai_chatbot_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs
      # Mapear a pasta de estado de sincronização
      - ./docs/sil/.sync_state.json:/app/docs/sil/.sync_state.json
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fai_chatbot_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: fai_network
